<text x="715" y="312" class="t">AgentModule — AgentService loop</text>
<text x="715" y="330" class="small">6 tools: search - analyze - check_fit</text>
<text x="715" y="346" class="small">balance - submit - list_known</text>
<text x="715" y="368" class="t">MealPlanModule — pipeline</text>
<text x="715" y="386" class="small">evaluateAllergySafety EU-14</text>
<text x="715" y="402" class="small">checkTime - selectRanked</text>
<text x="715" y="424" class="t">FallbackPlanner (deterministico)</text>
<text x="715" y="442" class="small">stesso ranking, se budget esaurito</text>

<rect x="1040" y="265" width="300" height="220" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
<text x="1055" y="290" class="h" fill="#9d174d">ANALISI E DATI</text>
<text x="1055" y="312" class="t">VideosModule cache-first</text>
<text x="1055" y="330" class="small">VIDEO_ANALYZER live/mock</text>
<text x="1055" y="346" class="small">ANALYSIS_STORE Pg/File 30gg</text>
<text x="1055" y="368" class="t">LlmModule LLM_CLIENT</text>
<text x="1055" y="386" class="small">GenAI - Mock</text>
<text x="1055" y="408" class="t">YouTube - Nutrition - Shopping</text>
<text x="1055" y="426" class="small">quota + 24h cache - FDC - lista spesa</text>

