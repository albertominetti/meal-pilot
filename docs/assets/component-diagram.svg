<text x="75" y="410" class="small">POST /api/meal-plan/agent</text>
<text x="75" y="432" class="t">Plans - Videos - Shopping - Users</text>
<text x="75" y="450" class="small">CRUD piani / cache / liste</text>

<rect x="380" y="265" width="300" height="220" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="395" y="290" class="h" fill="#9a3412">ORCHESTRATORE</text>
<text x="395" y="312" class="t">PlansModule + PlansService</text>
<text x="395" y="332" class="small">createDeterministic()</text>
<text x="395" y="348" class="small">createWithAgent(debug)</text>
<text x="395" y="364" class="small">swap() cache-first - agent</text>
<text x="395" y="380" class="small">checked state - save planId</text>
<text x="395" y="410" class="t">ProfilesService</text>
<text x="395" y="428" class="small">resolve() - merge allergies</text>
<text x="395" y="460" class="small">USER_DATA_STORE Pg/File</text>

<rect x="700" y="265" width="320" height="220" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
