<rect width="1400" height="920" fill="#f8fafc"/>

<text x="40" y="45" class="title">MealPilot — Diagramma Componenti NestJS</text>
<text x="40" y="68" class="sub">Client - AppModule (controller - service - tool/store) - provider esterni</text>

<rect x="40" y="90" width="400" height="90" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="60" y="117" class="h" fill="#1e3a8a">CLIENTS</text>
<text x="60" y="138" class="t" fill="#1e3a8a">JJFit App (iOS/Android)</text>
<text x="60" y="156" class="t" fill="#1e3a8a">Swagger UI /api/docs - Landing /</text>

<rect x="470" y="90" width="420" height="90" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="490" y="117" class="h" fill="#92400e">BOOTSTRAP — main.ts</text>
<text x="490" y="138" class="t" fill="#92400e">globalPrefix /api - ValidationPipe - CORS</text>
<text x="490" y="156" class="t" fill="#92400e">Swagger setup - static /app/</text>

<rect x="920" y="90" width="440" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="940" y="117" class="h" fill="#5b21b6">CORE GLOBALE (@Global)</text>
<text x="940" y="138" class="t" fill="#5b21b6">AppConfigModule — Zod typed config</text>
<text x="940" y="156" class="t" fill="#5b21b6">DbModule — DatabaseService pg/Neon</text>

<rect x="40" y="200" width="1320" height="530" rx="16" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
<text x="60" y="230" class="h" fill="#0f172a">AppModule — src/app.module.ts</text>
<text x="60" y="248" class="small">imports: Config - Db - Llm - Videos - YouTube - MealPlan - Agent - Shopping - Users - Plans + RequestLoggingInterceptor</text>

<rect x="60" y="265" width="300" height="220" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="75" y="290" class="h" fill="#065f46">CONTROLLERS (HTTP)</text>
<text x="75" y="312" class="t">HealthController</text>
<text x="75" y="330" class="small">GET /api/health</text>
<text x="75" y="352" class="t">MealPlanController</text>
<text x="75" y="370" class="small">POST /api/meal-plan</text>
