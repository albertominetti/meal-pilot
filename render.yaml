# Render Blueprint for MealPilot.
# Deploy via the Render dashboard: New -> Blueprint -> select this repo.
# Only one web service; Swagger UI (GET / -> /api/docs) is the test UI.
services:
  - type: web
    name: meal-pilot
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: "npm ci && npm run build"
    startCommand: "npm start"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MEALPILOT_LLM_MODE
        value: auto
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      # Optional secrets: the operator sets these in the Render dashboard.
      # sync: false keeps them out of the repo.
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      # Neon Postgres lives outside Render (project meal-pilot, eu-central-1).
      # DATABASE_URL is the pooled URL; DATABASE_URL_DIRECT is the direct URL,
      # used to migrate at startup because the free plan has no pre-deploy step.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: FDC_API_KEY
        sync: false
      # S3-compatible storage (e.g. Neon S3). Values set in Render dashboard; sync: false keeps them out of the repo.
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AGENT_MAX_STEPS
        value: "12"
      - key: AGENT_MAX_ANALYSES
        value: "8"
      - key: AGENT_MAX_SEARCHES
        value: "4"
      - key: AGENT_TIMEOUT_MS
        value: "90000"
      - key: ANALYSIS_CONCURRENCY
        value: "3"
