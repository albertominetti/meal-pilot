# Render Blueprint for MealPilot.
# Deploy via the Render dashboard: New -> Blueprint -> select this repo.
# Only one web service; Swagger UI (GET / -> /api/docs) is the test UI.
services:
  - type: web
    name: meal-pilot
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: "npm ci && npm run build"
    startCommand: "npm start"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # auto = live Gemini when GEMINI_API_KEY is set, offline mock otherwise.
      - key: MEALPILOT_LLM_MODE
        value: auto
      # Secrets: set in the Render dashboard (sync: false keeps them out of the repo).
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_VIDEO_RESOLUTION
        value: low
      - key: AGENT_MAX_STEPS
        value: "12"
      - key: AGENT_MAX_SEARCHES
        value: "4"
      - key: AGENT_MAX_ANALYSES
        value: "8"
      - key: AGENT_TIMEOUT_MS
        value: "150000"
      - key: YOUTUBE_DAILY_QUOTA
        value: "9000"
